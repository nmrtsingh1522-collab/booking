spring:
  application:
    name: booking

  datasource:
    url: jdbc:mysql://localhost:3306/touristdb
    username: namrata
    password: namrata
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

resilience4j:
  circuit breaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env

  endpoint:
    health:
      show-details: always