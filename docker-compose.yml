services:

  booking:
    build: .
    container_name: booking-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: